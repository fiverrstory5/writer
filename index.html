<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Typing & TTS Studio — Dual Workspace</title>
    <!-- Studio Dual Unified Vector Icon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0d0e12">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Unified Global Header & Layout Mode Switcher -->
    <header class="global-header">
        <div class="header-left">
            <div class="brand">
                <img src="favicon.svg" alt="Logo" class="brand-logo">
                <span class="brand-name">Studio <span class="brand-badge">Dual</span></span>
            </div>

            <!-- View Mode Switcher -->
            <nav class="view-mode-group" role="tablist" aria-label="Layout modes">
                <button class="mode-btn" id="btnModeWriter" title="Show Writer Only (100% width)">
                    ✍️ Writer
                </button>
                <button class="mode-btn active" id="btnModeSplit" title="Show Both Side-by-Side (Resizable)">
                    ◫ Split
                </button>
                <button class="mode-btn" id="btnModeReader" title="Show Reader Only (100% width)">
                    🔊 Reader
                </button>
            </nav>
        </div>

        <div class="header-right">
            <!-- Bridge Action: Instant Transfer from Writer to Reader -->
            <button class="btn-bridge" id="btnSendToReader" title="Send text from Writer to Reader and start reading (Ctrl + Enter)">
                <span>Send to Reader</span>
                <span class="bridge-arrow">➔</span>
            </button>
        </div>
    </header>

    <!-- Main Dual Split Workspace Container -->
    <main class="split-container" id="splitContainer">

        <!-- ==================================================================
             LEFT PANE: Writer (Voice Typing Studio)
             ================================================================== -->
        <section class="pane pane-writer" id="paneWriter" aria-label="Voice Typing Studio">
            <!-- Writer Floating Top Toolbar -->
            <div class="pane-toolbar writer-toolbar">
                <div class="toolbar-group">
                    <button class="btn btn-mic" id="btnWriterMic" title="Toggle Voice Typing (Alt + V)">
                        <span id="micIcon" class="mic-dot"></span>
                        <span id="micLabel">Start</span>
                    </button>

                    <div class="lang-dropdown" title="Speech Language">
                        <select id="selectMicLang">
                            <option value="hi-IN" selected>Hindi</option>
                            <option value="en-IN">English (IN)</option>
                            <option value="en-US">English (US)</option>
                        </select>
                    </div>

                    <button class="btn btn-rules" id="btnOpenRules" title="Word Replacements Dictionary">
                        <span>Dict</span>
                        <span class="rules-badge" id="rulesCountBadge">0</span>
                    </button>
                </div>

                <div class="toolbar-group">
                    <button class="btn btn-action" id="btnWriterCopy" title="Copy text">📋 Copy</button>
                    <button class="btn btn-action" id="btnWriterDownload" title="Save text file">💾 Save</button>
                    <button class="btn btn-clear" id="btnWriterClear" title="Double-click to clear workspace">🧹 Clear</button>
                </div>
            </div>

            <!-- Writer Workspace Canvas -->
            <div class="workspace-scroll" id="writerScrollContainer">
                <div class="editor editor-writer" id="writerEditor" contenteditable="true" autofocus
                     placeholder="Speak or type your notes here..."></div>
            </div>

            <!-- Writer Floating Bottom Corner Badges (No blocking bar) -->
            <div class="floating-badges writer-badges">
                <div class="badge-pill stats-pill-writer" id="writerStatsBadge">
                    <span id="lblWordCount">0 words</span>
                    <span class="dot-separator">•</span>
                    <span id="lblCharCount">0 characters</span>
                    <span class="dot-separator">•</span>
                    <span class="writer-status-txt" id="lblWriterStatus">Ready</span>
                </div>
            </div>
        </section>

        <!-- ==================================================================
             DRAGGABLE SPLITTER / RESIZER DIVIDER
             ================================================================== -->
        <div class="splitter" id="splitter" title="Drag left/right to resize • Double-click to reset 50:50">
            <button class="splitter-collapse-btn btn-collapse-left" id="btnCollapseLeft" title="Collapse Writer (Full Reader)">◀</button>
            <div class="splitter-handle"></div>
            <button class="splitter-collapse-btn btn-collapse-right" id="btnCollapseRight" title="Collapse Reader (Full Writer)">▶</button>
        </div>

        <!-- ==================================================================
             RIGHT PANE: Reader (TTS Workspace)
             ================================================================== -->
        <section class="pane pane-reader" id="paneReader" aria-label="TTS Reading Workspace">
            <!-- Reader Floating Top Toolbar -->
            <div class="pane-toolbar reader-toolbar">
                <div class="toolbar-group">
                    <button class="btn btn-paste" id="btnReaderPaste" title="Paste text (Ctrl + V)">📥 Paste</button>
                    <button class="btn btn-clear" id="btnReaderClear" title="Clear workspace">🧹 Clear</button>
                    <button class="btn btn-clean-toggle active" id="btnReaderToggleClean" title="Toggle Clean vs Original text">
                        <span id="cleanIcon">🧹</span>
                        <span id="cleanLabel">Clean Text</span>
                    </button>
                </div>

                <div class="toolbar-group">
                    <div class="slider-group" title="Scroll or slide to adjust playback speed">
                        <span class="slider-label">Speed:</span>
                        <input type="range" id="speedSlider" min="0.75" max="2.5" step="0.05" value="1.45" class="speed-slider">
                        <span id="speedValue" class="speed-badge">1.45x</span>
                    </div>
                </div>
            </div>

            <!-- Compact Smart Auto-Scroll Re-center Button -->
            <button class="scroll-resume-pill" id="readerScrollResumePill" title="Auto-scroll paused (Click to re-center)">
                📍
            </button>

            <!-- Reader Reading Canvas -->
            <div class="workspace-scroll" id="readerScrollContainer">
                <div class="editor editor-reader" id="readerEditor" contenteditable="true"
                     placeholder="Paste text here (or click 'Send to Reader ➔') to listen..."></div>
            </div>

            <!-- Reader Floating Bottom Player Bar -->
            <div class="bottom-player" id="readerBottomPlayer">
                <button class="ctrl-btn" id="btnPrev" title="Previous (Left Arrow)">⏮</button>
                <button class="ctrl-btn play-btn" id="btnPlayPause" title="Play / Pause (Space)">▶</button>
                <button class="ctrl-btn" id="btnNext" title="Next (Right Arrow)">⏭</button>

                <div class="track-wrapper">
                    <div class="track-info">
                        <div class="track-left">
                            <span id="lblTime" class="time-display">00:00 / 00:00</span>
                            <span id="lblCounter" class="counter-display">Line 0 / 0</span>
                        </div>
                        <span id="lblReaderStatus" style="color: #71717a;">Ready</span>
                    </div>
                    <div class="track-bar" id="trackBar" title="Click to jump in timeline">
                        <div class="track-fill" id="trackFill"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Smart Word Auto-Replacement Modal (Writer) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">
                    <span>Dictionary Replacements</span>
                </div>
                <button class="modal-close" id="btnCloseRules" title="Close (Esc)">✕</button>
            </div>
            <div class="modal-body">
                <div class="add-rule-card">
                    <div class="form-row">
                        <input type="text" id="inputFrom" class="input-rule" placeholder="Spoken triggers (e.g. word1, word2)">
                    </div>
                    <div class="form-row form-row-bottom">
                        <input type="text" id="inputTo" class="input-rule" placeholder="Replace with (e.g. Word)">
                        <select id="selectRuleMode" class="select-rule-mode" title="Mode">
                            <option value="auto">⚡ Auto</option>
                            <option value="suggest">💡 Suggest</option>
                        </select>
                        <button class="btn-add-rule" id="btnAddRule">+ Add</button>
                    </div>
                </div>

                <div class="rules-list" id="rulesListContainer"></div>

                <div class="modal-footer-tools">
                    <button class="btn-tool-secondary" id="btnExportRules" title="Export rules backup">📥 Export</button>
                    <button class="btn-tool-secondary" id="btnImportRules" title="Import rules backup">📤 Import</button>
                    <input type="file" id="fileImportRules" accept=".json" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal (Writer) -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-card">
            <div class="confirm-icon">⚠️</div>
            <div class="confirm-title" id="confirmTitle">Delete this rule?</div>
            <div class="confirm-desc" id="confirmDesc">This action cannot be undone.</div>
            <div class="confirm-actions">
                <button class="btn-confirm-cancel" id="btnConfirmCancel">Cancel</button>
                <button class="btn-confirm-delete" id="btnConfirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <!-- Floating Selection Action Menu (Writer) -->
    <div class="floating-menu" id="floatingMenu" role="toolbar" aria-label="Quick Actions">
        <button class="floating-btn" id="btnFloatCopy" title="Copy selection">📋 Copy</button>
        <button class="floating-btn" id="btnFloatPaste" title="Paste clipboard">📥 Paste</button>
        <button class="floating-btn floating-btn-danger" id="btnFloatDelete" title="Delete selection">🗑 Delete</button>
    </div>

    <!-- Global Toast Notification -->
    <div class="toast" id="toastMessage">Notification</div>

    <!-- Core Unified Application Logic -->
    <script src="app.js"></script>
</body>
</html>
