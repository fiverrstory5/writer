<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926"/>
      <stop offset="50%" stop-color="#0f1016"/>
      <stop offset="100%" stop-color="#090a0e"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Mic Capsule Gradient -->
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Voice Wave Gradient (Left) -->
    <linearGradient id="voiceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Text Wave Gradient (Right) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left: Voice Soundwaves -->
  <g filter="url(#glow)">
    <!-- Inner Sound Arc -->
    <path d="M15 24 A 11 11 0 0 0 15 38" fill="none" stroke="url(#voiceGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Outer Sound Arc -->
    <path d="M10 20 A 17 17 0 0 0 10 42" fill="none" stroke="url(#voiceGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75"/>
  </g>

  <!-- Center: Studio Microphone -->
  <g filter="url(#glow)">
    <!-- Mic Capsule -->
    <rect x="25.5" y="14" width="13" height="21" rx="6.5" fill="url(#micGrad)"/>
    
    <!-- Grille Divider Line -->
    <line x1="26.5" y1="24" x2="37.5" y2="24" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
    
    <!-- Mic U-Shape Cradle -->
    <path d="M21 26 C21 34 25.5 39 32 39 C38.5 39 43 34 43 26" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Mic Stand Stem -->
    <path d="M32 39 V46" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Mic Stand Base -->
    <path d="M25 46 H39" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Right: Transcribed Text Lines & Blinking Cursor -->
  <g filter="url(#glow)">
    <!-- Text Line 1 -->
    <rect x="47" y="21" width="8" height="2.5" rx="1.25" fill="#38bdf8"/>
    <!-- Text Line 2 (longer) -->
    <rect x="47" y="27" width="11" height="2.5" rx="1.25" fill="#38bdf8"/>
    <!-- Text Line 3 with typing cursor dot -->
    <rect x="47" y="33" width="6" height="2.5" rx="1.25" fill="#38bdf8"/>
    <!-- Cursor Dot -->
    <circle cx="56.5" cy="34.2" r="1.6" fill="#34d399"/>
  </g>
</svg>
