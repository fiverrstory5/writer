<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Border Glow Gradient: Cyan to Electric Violet -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Writer (Microphone) Gradient -->
    <linearGradient id="writerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Reader (Speaker) Gradient -->
    <linearGradient id="readerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Spectrum Equalizer Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Card -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Subtle Tech Coordinate Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Left Side: Writer (Microphone + Inbound Voice Waves) -->
  <g filter="url(#glow)">
    <path d="M 21 51 A 15 15 0 0 0 21 77" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M 27 55 A 10 10 0 0 0 27 73" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Mic Capsule -->
    <rect x="35" y="45" width="14" height="24" rx="7" fill="url(#writerGrad)" />
    <line x1="36" y1="56" x2="48" y2="56" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

    <!-- Cradle -->
    <path d="M 30 56 C 30 67 36 73 42 73 C 48 73 54 67 54 56" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
    <!-- Stem & Base -->
    <path d="M 42 73 V 81 M 35 81 H 49" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Center Bridge: Voice Spectrum Equalizer Bars -->
  <g>
    <rect x="59" y="58" width="3" height="12" rx="1.5" fill="url(#bridgeGrad)" />
    <rect x="64" y="50" width="3.5" height="28" rx="1.75" fill="#818cf8" />
    <rect x="70" y="55" width="3" height="18" rx="1.5" fill="url(#bridgeGrad)" />
  </g>

  <!-- Right Side: Reader (Speaker + Outbound Sound Waves) -->
  <g filter="url(#glow)">
    <!-- Speaker Body -->
    <rect x="77" y="57" width="5" height="14" rx="2" fill="#c084fc" />
    <polygon points="82,57 91,48 91,80 82,71" fill="url(#readerGrad)" />

    <!-- Outbound Sound Waves -->
    <path d="M 97 56 A 10 10 0 0 1 97 72" fill="none" stroke="#e879f9" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M 103 50 A 17 17 0 0 1 103 78" fill="none" stroke="#e879f9" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.5" />
  </g>
</svg>